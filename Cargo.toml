[package]
name = "tcp_router"
version = "0.1.0"
edition = "2021"
default-run = "tcp_router"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
chrono = "0.4"
regex = "1.10"
lru = "0.18.0"
lz4_flex = "0.13.0"
tokio-postgres = { version = "0.7.17", features = [ "runtime", "with-uuid-1" ] }
deadpool-postgres = { version = "0.14.1", features = ["serde"] }
async-trait = "0.1.89"

[dependencies.tokio]
version = "1.0"
features = ["full"]
