[tcp_input]
listen_address = "127.0.0.1:9000"

[[routes]]
name = "solana"
enabled = true
pattern = "^[1-9A-HJ-NP-Za-km-z]{32,44}$"
output_type = "tcp"
output_address = "127.0.0.1:1266"
# output_address = "127.0.0.1:9999"
output_format = { context = "MINT_ADDRESS", command = "tg", channel_field = "chat_name", text_field = "text", timestamp_field = "auto", escape_newlines = true }

[[routes]]
name = "ethereum"
enabled = true
pattern = "^0x[a-fA-F0-9]{64}$|^0x[a-fA-F0-9]{40}$"
output_type = "tcp"
output_address = "127.0.0.1:1282"
output_format = { context = "ETH_MINT_ADDRESS", command = "tg_eth", channel_field = "chat_name", text_field = "text", timestamp_field = "auto", escape_newlines = true }
chain_hints = ["ethereum", "eth", "erc20", "mainnet"]

[[routes]]
name = "bnb"
enabled = true
pattern = "^0x[a-fA-F0-9]{40}$"
output_type = "tcp"
output_address = "127.0.0.1:9003"
output_format = { context = "BNB_MINT_ADDRESS", command = "tg_bnb", channel_field = "chat_name", text_field = "text", timestamp_field = "auto", escape_newlines = false }
chain_hints = ["bsc", "bnb", "binance", "bep20", "pancake", "bscan"]

[monitoring]
log_messages = true
log_errors = true
log_connections = true
log_forwarding = true
log_forwarding_payload = true  # NEW: Log actual payload being sent
log_incoming_payload = false   # NEW: Log incoming payload (can be sensitive)

[database]
host = "localhost"
port = 5432
user = 'tcp_router_user'
password = 'your_secure_password'
dbname = "tcp_router"
pool_size = 10
cache_size_mb = 100
cache_ttl_seconds = 300
compress_messages = true

[query_server]
enabled = true
listen_address = "127.0.0.1:9999"

[ignore_channels]
chat_ids = [
    -1001234567890,
    -1009876543210,
]

chat_names = [
    # "spam_channel",
    # "test_channel",
    # "ignore_this",
    "Skeleton Trending",
]

patterns = [
